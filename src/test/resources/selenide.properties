# Selenide Configuration for Visible Browser Testing
browser=chrome
browserSize=1920x1080
headless=false
timeout=10000
pageLoadTimeout=30000
holdBrowserOpen=false
screenshots=true
savePageSource=true
reportsFolder=build/reports/tests/screenshots
downloadsFolder=build/reports/tests/downloads

# Chrome specific settings
chromeoptions.args=--disable-web-security,--disable-features=VizDisplayCompositor,--no-sandbox,--disable-dev-shm-usage

# Wait settings
wait.timeout=10000
wait.pollingInterval=200
