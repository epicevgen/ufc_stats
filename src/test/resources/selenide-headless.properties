# Selenide Configuration for Headless Browser Testing
browser=chrome
browserSize=1920x1080
headless=true
timeout=10000
pageLoadTimeout=30000
holdBrowserOpen=false
screenshots=true
savePageSource=true
reportsFolder=build/reports/tests/screenshots
downloadsFolder=build/reports/tests/downloads

# Chrome specific settings for headless mode
chromeoptions.args=--headless,--no-sandbox,--disable-dev-shm-usage,--disable-gpu,--window-size=1920,1080

# Wait settings
wait.timeout=10000
wait.pollingInterval=200
