plugins {
    id 'org.springframework.boot' version '3.0.6'
    id 'io.spring.dependency-management' version '1.1.0'
    id 'java'
    id 'application'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starter
    implementation 'org.springframework.boot:spring-boot-starter'

    // Spring Data JPA для работы с БД через ORM
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // SQLite JDBC драйвер
    implementation 'org.xerial:sqlite-jdbc:3.49.1.0'

    // Hibernate SQLite диалект
    implementation 'org.hibernate.orm:hibernate-community-dialects:6.2.7.Final'

    // JavaFX зависимости (укажите версии, соответствующие вашей JDK)
    implementation 'org.openjfx:javafx-controls:20'
    implementation 'org.openjfx:javafx-fxml:20'

    // Тестовые зависимости
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

application {
    mainClass = 'com.example.Launcher' // Класс с методом main, запускающим JavaFX
}

tasks.withType(JavaExec) {
    // Параметры для JavaFX (если требуется)
    jvmArgs = [
            '--module-path', classpath.asPath,
            '--add-modules', 'javafx.controls,javafx.fxml'
    ]
}
