version: '3.8'

services:
  # Development environment
  ufc-stats-dev:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DATABASE_URL=jdbc:h2:file:/app/data/ufc_stats_dev
    volumes:
      - ./data:/app/data
    networks:
      - ufc-stats-network

  # Production environment
  ufc-stats-prod:
    build: .
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DATABASE_URL=jdbc:postgresql://postgres:5432/ufc_stats
      - DATABASE_USERNAME=ufc_stats
      - DATABASE_PASSWORD=secure_password
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=secure_admin_password
    depends_on:
      - postgres
    volumes:
      - ./data:/app/data
    networks:
      - ufc-stats-network

  # PostgreSQL for production
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=ufc_stats
      - POSTGRES_USER=ufc_stats
      - POSTGRES_PASSWORD=secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - ufc-stats-network

  # Nginx reverse proxy (optional)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - ufc-stats-prod
    networks:
      - ufc-stats-network

volumes:
  postgres_data:

networks:
  ufc-stats-network:
    driver: bridge
