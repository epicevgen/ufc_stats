<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Создание боев для пагинации</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Создание боев для тестирования пагинации</h1>
        <p>Нажмите кнопку ниже, чтобы создать 15 боев для демонстрации пагинации:</p>
        
        <button id="createFightsBtn" class="btn btn-primary">Создать 15 боев</button>
        
        <div id="status" class="mt-3"></div>
        
        <div id="progress" class="mt-3" style="display: none;">
            <div class="progress">
                <div class="progress-bar" role="progressbar" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('createFightsBtn').addEventListener('click', async function() {
            const btn = this;
            const status = document.getElementById('status');
            const progress = document.getElementById('progress');
            const progressBar = progress.querySelector('.progress-bar');
            
            btn.disabled = true;
            btn.textContent = 'Создание боев...';
            progress.style.display = 'block';
            
            const fighters = ['Иван Петров', 'Алексей Сидоров', 'Дмитрий Волков', 'Сергей Козлов', 'Андрей Морозов'];
            const opponents = ['Джон Смит', 'Майк Джонсон', 'Том Уилсон', 'Джейк Браун', 'Боб Дэвис'];
            const results = ['WIN', 'LOSS', 'DRAW'];
            const methods = ['DECISION', 'KNOCKOUT', 'SUBMISSION', 'EARLY_EXIT'];
            const modes = ['STANCE', 'MMA'];
            const weightClasses = ['LIGHTWEIGHT', 'WELTERWEIGHT', 'MIDDLEWEIGHT', 'LIGHT_HEAVYWEIGHT', 'HEAVYWEIGHT'];
            
            let created = 0;
            const total = 15;
            
            for (let i = 0; i < total; i++) {
                try {
                    const fightData = {
                        myFighter: fighters[i % fighters.length],
                        opponent: opponents[i % opponents.length],
                        fightDate: `2024-01-${String(15 + i).padStart(2, '0')}T20:00:00`,
                        fightMode: modes[i % modes.length],
                        season: 2024,
                        result: results[i % results.length],
                        method: methods[i % methods.length],
                        roundsPlayed: (i % 5) + 1,
                        ratingPoints: 1500 + (i * 10),
                        rankingPosition: i + 1,
                        weightClass: weightClasses[i % weightClasses.length],
                        notes: `Тестовый бой #${i + 1}`
                    };
                    
                    const response = await fetch('/api/fights', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(fightData)
                    });
                    
                    if (response.ok) {
                        created++;
                        status.innerHTML = `Создано боев: ${created}/${total}`;
                        progressBar.style.width = `${(created / total) * 100}%`;
                    } else {
                        console.error(`Ошибка при создании боя ${i + 1}:`, await response.text());
                    }
                    
                    // Небольшая пауза между запросами
                    await new Promise(resolve => setTimeout(resolve, 100));
                    
                } catch (error) {
                    console.error(`Ошибка при создании боя ${i + 1}:`, error);
                }
            }
            
            btn.disabled = false;
            btn.textContent = 'Создать 15 боев';
            
            if (created > 0) {
                status.innerHTML = `<div class="alert alert-success">Успешно создано ${created} боев! <a href="/fights" class="btn btn-sm btn-outline-success">Перейти к списку боев</a></div>`;
            } else {
                status.innerHTML = '<div class="alert alert-danger">Не удалось создать бои. Проверьте консоль браузера.</div>';
            }
        });
    </script>
</body>
</html>
